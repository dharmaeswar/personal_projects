[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-load-planning-weight-balance"
version = "1.0.0"
description = "Aircraft load planning, weight-and-balance checks, auto load verification, scale-log reconciliation and event-driven messaging"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["airload*"]
