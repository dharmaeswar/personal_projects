# Broker host provisioning — Ansible playbook.
# Declarative only: validated by messaging.iac.check_ansible_playbook
# and never executed against a real host by this project.
- name: Provision messaging broker hosts
  hosts: messaging_brokers
  become: true
  vars:
    kafka_version: "3.6.0"
    data_dir: /var/lib/kafka/data
    log_dir: /var/log/kafka
  tasks:
    - name: Install Java runtime
      ansible.builtin.apt:
        name: openjdk-17-jre-headless
        state: present
        update_cache: true

    - name: Create kafka system user
      ansible.builtin.user:
        name: kafka
        system: true
        shell: /usr/sbin/nologin

    - name: Create Kafka data directory
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: kafka
        group: kafka
        mode: "0750"

    - name: Deploy broker server properties
      ansible.builtin.template:
        src: server.properties.j2
        dest: /etc/kafka/server.properties
        owner: kafka
        group: kafka
        mode: "0640"
      notify: Restart Kafka

    - name: Enable and start Kafka service
      ansible.builtin.service:
        name: kafka
        state: started
        enabled: true

    - name: Check broker health endpoint
      ansible.builtin.uri:
        url: "http://localhost:8080/health"
        status_code: 200
      retries: 5
      delay: 10

  handlers:
    - name: Restart Kafka
      ansible.builtin.service:
        name: kafka
        state: restarted
