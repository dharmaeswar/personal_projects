<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gas Ops Decision Support</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
  table { border-collapse: collapse; margin: 8px 0 16px; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
  th { background: #eee; }
  section { margin-bottom: 28px; }
  label { display: block; margin: 6px 0; }
  button { padding: 6px 14px; margin-top: 6px; }
  #route-result, #sim-result, #forecast-result { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Industrial Gas Operations — Decision Support</h1>
<p>Synthetic demo data only. Plants, customers and demand are seeded test
data, not real operations.</p>

<section>
<h2>Plant inventory</h2>
<table id="inventory"><thead><tr><th>Plant</th><th>Product</th><th>On hand (t)</th><th>Safety stock (t)</th></tr></thead><tbody></tbody></table>
</section>

<section>
<h2>7-day demand forecast</h2>
<label>Customer
<select id="forecast-customer"></select>
</label>
<button id="forecast-btn">Forecast</button>
<div id="forecast-result"></div>
</section>

<section>
<h2>Delivery route planner</h2>
<label>Plant
<select id="route-plant"></select>
</label>
<div id="route-customers"></div>
<button id="route-btn">Plan route</button>
<div id="route-result"></div>
</section>

<section>
<h2>Stockout simulation</h2>
<label>Customer
<select id="sim-customer"></select>
</label>
<label>On-hand inventory (tonnes)
<input id="sim-inventory" type="number" value="90" min="0" step="1">
</label>
<button id="sim-btn">Simulate</button>
<div id="sim-result"></div>
</section>

<script>
async function load() {
  const dash = await (await fetch('/api/dashboard')).json();
  const invBody = document.querySelector('#inventory tbody');
  dash.inventory.forEach(function (row) {
    const tr = document.createElement('tr');
    [row.name, row.product, row.on_hand_t, row.safety_stock_t].forEach(function (v) {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    invBody.appendChild(tr);
  });
  const plantSel = document.querySelector('#route-plant');
  dash.plants.forEach(function (p) {
    const opt = document.createElement('option');
    opt.value = p.plant_id;
    opt.textContent = p.name + ' (' + p.product + ')';
    plantSel.appendChild(opt);
  });
  const custBox = document.querySelector('#route-customers');
  dash.customers.forEach(function (c) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.value = c.customer_id;
    label.appendChild(box);
    label.appendChild(document.createTextNode(' ' + c.name + ' (' + c.product + ', ' + c.base_demand_t + ' t/day)'));
    custBox.appendChild(label);
  });
  ['forecast-customer', 'sim-customer'].forEach(function (id) {
    const sel = document.getElementById(id);
    dash.customers.forEach(function (c) {
      const opt = document.createElement('option');
      opt.value = c.customer_id;
      opt.textContent = c.name;
      sel.appendChild(opt);
    });
  });
}

document.getElementById('forecast-btn').addEventListener('click', async function () {
  const id = document.getElementById('forecast-customer').value;
  const data = await (await fetch('/api/forecast?customer=' + id + '&days=7')).json();
  document.getElementById('forecast-result').textContent =
    'Next 7 days (tonnes): ' + data.forecast.join(', ') +
    '\nBacktest MAPE: ' + data.backtest_mape_pct + '% vs naive ' + data.naive_mape_pct + '%';
});

document.getElementById('route-btn').addEventListener('click', async function () {
  const plant = document.getElementById('route-plant').value;
  const customers = Array.from(document.querySelectorAll('#route-customers input:checked')).map(function (b) { return b.value; });
  const data = await (await fetch('/api/route', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ plant: plant, customers: customers })
  })).json();
  document.getElementById('route-result').textContent =
    data.error ? data.error :
    'Visit order: ' + data.order.join(' -> ') +
    '\nOptimized distance: ' + data.distance_km + ' km (naive order: ' + data.naive_km +
    ' km, saved ' + data.saved_pct + '%)';
});

document.getElementById('sim-btn').addEventListener('click', async function () {
  const id = document.getElementById('sim-customer').value;
  const inv = document.getElementById('sim-inventory').value;
  const data = await (await fetch('/api/simulate?customer=' + id + '&inventory=' + inv)).json();
  document.getElementById('sim-result').textContent =
    'Mean daily demand: ' + data.mean_t + ' t, sd ' + data.sd_t + ' t' +
    '\nStockout probability at ' + inv + ' t on hand: ' + (data.stockout_probability * 100).toFixed(1) + '%' +
    '\nSafety stock for 95% service: ' + data.safety_stock_95_t + ' t';
});

load();
</script>
</body>
</html>
