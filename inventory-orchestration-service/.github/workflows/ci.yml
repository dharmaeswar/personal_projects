name: CI

on:
  push:
    paths:
      - "inventory-orchestration-service/**"
  pull_request:
    paths:
      - "inventory-orchestration-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        working-directory: inventory-orchestration-service
        run: python -m pytest tests/ -q
      - name: Build image
        run: docker build -t inventory-orchestration:latest inventory-orchestration-service
