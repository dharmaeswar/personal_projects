apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-orchestration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-orchestration
  template:
    metadata:
      labels:
        app: inventory-orchestration
    spec:
      containers:
        - name: service
          image: inventory-orchestration:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
