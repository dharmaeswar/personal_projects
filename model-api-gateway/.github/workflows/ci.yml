# CI for the Model API Gateway: test on every push/PR, then build and
# push a multi-arch (amd64 + arm64) container image.
#
# NOTE: GitHub Actions only runs workflows from the repository root, so
# this file lives here as the project's pipeline definition — to enable
# it, copy it to <repo-root>/.github/workflows/model-api-gateway-ci.yml.
# The paths filter below already scopes it to this subfolder.
name: model-api-gateway CI

on:
  push:
    branches: [main]
    paths:
      - "model-api-gateway/**"
  pull_request:
    paths:
      - "model-api-gateway/**"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r model-api-gateway/requirements.txt
      - name: Run tests
        working-directory: model-api-gateway
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: model-api-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/model-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
