# Model API Gateway on Kubernetes.
# Apply with: kubectl apply -f k8s/
# The Deployment runs 2 replicas of the stdlib-only gateway image; the
# Service exposes it inside the cluster on port 8000. Probes hit /health.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-api-gateway
  labels:
    app: model-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-api-gateway
  template:
    metadata:
      labels:
        app: model-api-gateway
    spec:
      containers:
        - name: gateway
          # Replace with your registry image, e.g. ghcr.io/<user>/model-api-gateway:latest
          image: model-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: model-api-gateway
  labels:
    app: model-api-gateway
spec:
  selector:
    app: model-api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
