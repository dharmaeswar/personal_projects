apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-servicing-frontend
  labels:
    app: mortgage-servicing-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mortgage-servicing-frontend
  template:
    metadata:
      labels:
        app: mortgage-servicing-frontend
    spec:
      containers:
        - name: frontend
          # Replace <account>.dkr.ecr.<region>.amazonaws.com with your ECR repo.
          image: mortgage-servicing-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mortgage-servicing-frontend
  labels:
    app: mortgage-servicing-frontend
spec:
  selector:
    app: mortgage-servicing-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
