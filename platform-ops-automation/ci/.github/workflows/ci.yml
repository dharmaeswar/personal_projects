name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker build -f docker/Dockerfile -t platform-ops:latest .
          else
            echo "docker not available in this runner; skipping image build"
          fi

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate Kubernetes manifests
        run: |
          python -c "
          import glob, yaml
          for path in sorted(glob.glob('k8s/*.yaml')):
              with open(path) as f:
                  docs = list(yaml.safe_load_all(f))
              assert all(d.get('kind') for d in docs), path
              print(f'{path}: OK')
          "
