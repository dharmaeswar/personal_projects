apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-ops
  labels:
    app: platform-ops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: platform-ops
  template:
    metadata:
      labels:
        app: platform-ops
    spec:
      containers:
        - name: platform-ops
          image: platform-ops:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: platform-ops-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
