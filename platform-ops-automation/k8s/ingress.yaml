apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ops
  labels:
    app: platform-ops
spec:
  ingressClassName: nginx
  rules:
    - host: platform-ops.example.com  # placeholder host; replace for a real deployment
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-ops
                port:
                  number: 80
