[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-intelligence-analytics"
version = "0.1.0"
description = "Trend detection, anomaly flags and risk scoring over synthetic flight-safety data"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
