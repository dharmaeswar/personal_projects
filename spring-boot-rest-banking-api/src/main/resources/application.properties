spring.application.name=spring-boot-rest-banking-api
server.port=8080
# Requests allowed per client per minute before the rate-limit filter returns 429.
app.rate-limit.per-minute=100
# Keep error bodies in our own ErrorResponse shape; never leak a stack trace.
server.error.include-stacktrace=never
server.error.include-message=never
# Spring Actuator: expose health and info for deployment checks and operations.
# Only health/info are exposed over HTTP; all other actuator endpoints stay off.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
