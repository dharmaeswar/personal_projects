apiVersion: v1
kind: Service
metadata:
  name: vehicle-purchase-fulfilment
  labels:
    app: vehicle-purchase-fulfilment
spec:
  type: ClusterIP
  selector:
    app: vehicle-purchase-fulfilment
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vehicle-purchase-fulfilment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vehicle-purchase-fulfilment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
